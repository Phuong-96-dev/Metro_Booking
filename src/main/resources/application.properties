spring.application.name=metro

spring.config.import=optional:file:./.env[.properties]
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=metro;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
student-verification.ocr-command=tesseract
student-verification.ocr-languages=vie+eng
student-verification.storage-directory=${user.home}/metro-private/student-verification

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
app.auth.allow-legacy-passwords=${AUTH_ALLOW_LEGACY_PASSWORDS:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.google.link-redirect-uri=${GOOGLE_LINK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google-link}

# Official Gemini REST v1; credentials stay on the backend.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:25}

# Ticket QR/barcode validity when an API-issued ticket does not specify an expiry.
app.ticket.default-valid-days=${TICKET_DEFAULT_VALID_DAYS:30}

# SePay bank-transfer checkout and webhook authentication.
app.sepay.enabled=${SEPAY_ENABLED:false}
app.sepay.bank=${SEPAY_BANK:}
app.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
app.sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:}
app.sepay.payment-prefix=${SEPAY_PAYMENT_PREFIX:METRO}
app.sepay.transfer-prefix=${SEPAY_TRANSFER_PREFIX:}
app.sepay.webhook-auth-mode=${SEPAY_WEBHOOK_AUTH_MODE:HMAC}
app.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
app.sepay.api-key=${SEPAY_API_KEY:}
app.sepay.webhook-max-age-seconds=${SEPAY_WEBHOOK_MAX_AGE_SECONDS:300}
