<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Member Blogs</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" th:href="@{/common/navbar.css}" type="text/css">
  <link rel="stylesheet" th:href="@{/common/footer.css}" type="text/css">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2, h3 {
      font-weight: 600;
      color: #333;
    }

    .card {
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    .card img {
      border-bottom: 1px solid #eee;
    }

    .card-body h5 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2c3e50;
    }

    .card-text {
      font-size: 0.95rem;
      color: #555;
    }

    .card-footer {
      background: #f0f0f0;
      font-size: 0.85rem;
    }

    /* Main blog highlight */
    .main-blog .card {
      background: white;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .main-blog .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px 0 0 16px;
    }

    .main-blog .content-area {
      padding: 2rem;
    }

    .main-blog .content-area h3 {
      font-size: 2rem;
      color: #1a1a1a;
      margin-bottom: 1rem;
    }

    .main-blog .content-area p {
      font-size: 1.1rem;
      color: #555;
    }

    .main-blog .content-area .text-muted {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      .main-blog .card img {
        border-radius: 16px 16px 0 0;
        height: 250px;
      }
      .main-blog .content-area {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="container py-5">

  <h2 class="text-center mb-5">Blog Mới Nhất</h2>

  <!-- Bài mới nhất -->
  <div th:if="${blogs.size() > 0}" class="main-blog">
    <div class="card mb-5">
      <div class="row g-0 align-items-stretch">
        <div class="col-md-6">
          <img th:src="${blogs[0].imageUrl}" alt="Main blog image">
        </div>
        <div class="col-md-6 content-area d-flex flex-column justify-content-center">
          <h3 th:text="${blogs[0].title}"></h3>
          <p class="text-muted" th:text="'Ngày đăng: ' + ${blogs[0].postingDate}"></p>
          <p th:text="${blogs[0].content}"></p>
          <p class="fw-light" th:text="'Đăng bởi: ' + ${blogs[0].admin.name}"></p>
        </div>
      </div>
    </div>
  </div>

  <h3 class="mb-4" th:if="${blogs.size() > 1}">Các Bài Viết Khác</h3>

  <!-- Các bài còn lại -->
  <div class="row" th:if="${blogs.size() > 1}">
    <div class="col-md-4 mb-4" th:each="blog, iterStat : ${blogs}" th:if="${iterStat.index > 0}">
      <div class="card h-100 shadow-sm">
        <img th:src="${blog.imageUrl}" class="card-img-top" alt="Blog image"
             style="height:200px; object-fit:cover;">
        <div class="card-body">
          <h5 class="card-title" th:text="${blog.title}"></h5>
          <p class="card-text" th:text="${#strings.abbreviate(blog.content, 100)}"
             th:title="${blog.content}"></p>
        </div>
        <div class="card-footer text-muted">
          <small th:text="'Ngày đăng: ' + ${blog.postingDate}"></small><br>
          <small th:text="'Đăng bởi: ' + ${blog.admin.name}"></small>
        </div>
      </div>
    </div>
  </div>

  <!-- Nếu không có blog -->
  <div th:if="${blogs.size() == 0}">
    <p class="text-center text-muted">Hiện chưa có bài blog nào.</p>
  </div>

</div>
<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
