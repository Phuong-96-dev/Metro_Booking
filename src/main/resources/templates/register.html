<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/common/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/member/register.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/auth/auth.css}">
    <script defer th:src="@{/auth/auth.js}"></script>
</head>
<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="login-container">
    <h1>Đăng ký Metro</h1>

    <form th:action="@{/register}" th:object="${newMember}" method="post" data-auth-form>
        <ul class="auth-error" role="alert" th:if="${#fields.hasAnyErrors()}">
            <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
        </ul>

        <div class="input-group">
            <label for="name">Họ tên</label>
            <input type="text" th:field="*{name}" id="name" autocomplete="name" maxlength="100" required>
        </div>

        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="isStudentCheckbox">
            <label class="form-check-label" for="isStudentCheckbox">
                Tôi là sinh viên
            </label>
        </div>

        <div id="studentFields" style="display: none;">
            <div class="input-group">
                <label for="studentCard">Mã thẻ sinh viên</label>
                <input type="text" th:field="*{studentCard}" id="studentCard" maxlength="100">
            </div>

            <div class="input-group">
                <label for="schoolName">Tên trường</label>
                <input type="text" th:field="*{schoolName}" id="schoolName" maxlength="200">
            </div>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" th:field="*{email}" id="email" autocomplete="username" maxlength="254" required>
        </div>

        <div class="input-group">
            <label for="phone">Số điện thoại</label>
            <input type="tel" th:field="*{phone}" id="phone" autocomplete="tel" maxlength="20" pattern="[+0-9 \(\)\-]*">
        </div>

        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" name="password" id="password" autocomplete="new-password" minlength="12" maxlength="72" aria-describedby="password-help" required>
            <button class="password-toggle" type="button" data-password-toggle="password" aria-controls="password" aria-pressed="false">Hiện mật khẩu</button>
            <p id="password-help" class="auth-hint">Ít nhất 12 ký tự, gồm chữ và số; tối đa 72 byte UTF-8.</p>
        </div>
        <div class="input-group">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input type="password" name="confirmPassword" id="confirmPassword" autocomplete="new-password" minlength="12" maxlength="72" required>
            <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-pressed="false">Hiện mật khẩu</button>
        </div>

        <button type="submit" class="login-btn">Đăng ký</button>

        <div class="signup">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
        </div>
    </form>
</div>

<script>
    const checkbox = document.getElementById('isStudentCheckbox');
    const studentFields = document.getElementById('studentFields');
    checkbox.addEventListener('change', function () {
        studentFields.style.display = this.checked ? 'block' : 'none';
    });
</script>

<div th:replace="~{common/footer :: footer}"></div>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
