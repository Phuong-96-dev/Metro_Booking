<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/common/footer.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/member/register.css}" type="text/css">
</head>
<body>

<div th:replace="common/navbar :: navbar"></div>

<div class="login-container">
    <h1>Đăng ký Member</h1>

    <form th:action="@{/register}" th:object="${newMember}" method="post">

        <div class="input-group">
            <label for="name">Họ tên</label>
            <input type="text" th:field="*{name}" id="name" required>
        </div>

        <div class="form-check mb-3 text-start">
            <input class="form-check-input" type="checkbox" id="isStudentCheckbox">
            <label class="form-check-label" for="isStudentCheckbox">
                Tôi là sinh viên
            </label>
            <div class="form-text">Khai báo này không xác minh tư cách sinh viên. Sau khi đăng ký và đăng nhập, hãy gửi ảnh thẻ để ADMIN duyệt.</div>
        </div>

        <div id="studentFields" style="display: none;">
            <div class="input-group">
                <label for="studentCard">Mã thẻ sinh viên</label>
                <input type="text" th:field="*{studentCard}" id="studentCard">
            </div>

            <div class="input-group">
                <label for="schoolName">Tên trường</label>
                <input type="text" th:field="*{schoolName}" id="schoolName">
            </div>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" th:field="*{email}" id="email" required>
        </div>

        <div class="input-group">
            <label for="phone">Số điện thoại</label>
            <input type="text" th:field="*{phone}" id="phone" required>
        </div>

        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" th:field="*{password}" id="password" required>
        </div>

        <button type="submit" class="login-btn">Đăng ký</button>

        <div class="signup">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
        </div>
    </form>
</div>

<script>
    const checkbox = document.getElementById('isStudentCheckbox');
    const studentFields = document.getElementById('studentFields');
    checkbox.addEventListener('change', function () {
        studentFields.style.display = this.checked ? 'block' : 'none';
    });
</script>

<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
