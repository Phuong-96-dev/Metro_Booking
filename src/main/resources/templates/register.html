<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center">Đăng ký Member</h2>
    <form th:action="@{/register}" th:object="${member}" method="post" class="w-50 mx-auto">

        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="isStudentCheckbox">
            <label class="form-check-label" for="isStudentCheckbox">
                Tôi là sinh viên
            </label>
        </div>

        <div id="studentFields" style="display: none;">
            <div class="mb-3">
                <label class="form-label">Mã thẻ sinh viên</label>
                <input type="text" th:field="*{studentCard}" class="form-control"/>
            </div>

            <div class="mb-3">
                <label class="form-label">Tên trường</label>
                <input type="text" th:field="*{schoolName}" class="form-control"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input type="text" th:field="*{phone}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" th:field="*{password}" class="form-control" required/>
        </div>

        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // JavaScript để toggle
    const checkbox = document.getElementById('isStudentCheckbox');
    const studentFields = document.getElementById('studentFields');

    checkbox.addEventListener('change', function () {
        studentFields.style.display = this.checked ? 'block' : 'none';
    });
</script>
</body>
</html>
