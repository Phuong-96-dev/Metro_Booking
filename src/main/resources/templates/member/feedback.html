<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gửi bài viết / phản hồi</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/member/feedback.css}">
    <link rel="stylesheet" th:href="@{/common/navbar.css}">
    <link rel="stylesheet" th:href="@{/common/footer.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="container">
    <h2>Gửi bài viết / phản hồi</h2>
    <form th:action="@{/feedback/send}" method="post">
        <div>
            <label>Mức độ hài lòng (1-5):</label>
            <select name="rating" required>
                <option value="">-- Chọn mức độ --</option>
                <option value="1">1 - Rất không hài lòng</option>
                <option value="2">2 - Không hài lòng</option>
                <option value="3">3 - Bình thường</option>
                <option value="4">4 - Hài lòng</option>
                <option value="5">5 - Rất hài lòng</option>
            </select>
        </div>
        <div>
            <label>Tiêu đề:</label>
            <input type="text" name="title" required>
        </div>

        <div>
            <label>Nội dung:</label>
            <textarea name="content" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Gửi</button>
    </form>
</div>

<div th:replace="~{common/footer :: footer}"></div>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
