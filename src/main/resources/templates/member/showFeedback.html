<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Feedback</title>
    <link rel="stylesheet" th:href="@{/member/showFeedback.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<div th:replace="~{common/navbar :: navbar}"></div>

<div class="container">
    <h2>Danh sách Feedback</h2>

    <div class="feedback-list">
        <div class="feedback-card" th:each="feedback : ${feedbackList}">
            <div class="feedback-rating">
                <!-- Hiển thị số sao bằng icon -->
                <i class="fa-solid fa-star" style="color: gold;"
                   th:each="i : ${#numbers.sequence(1, feedback.rating)}"></i>
            </div>

            <div class="feedback-title" th:text="${feedback.title}"></div>
            <div class="feedback-content" th:text="${feedback.content}"></div>
            <div class="feedback-date">Ngày đăng: <span th:text="${feedback.postingDate}"></span></div>
            <div class="feedback-author">Người gửi: <span th:text="${feedback.member.name}"></span></div>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

</body>
</html>
