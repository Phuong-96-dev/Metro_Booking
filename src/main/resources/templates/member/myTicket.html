<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vé của tôi</title>
</head>
<body>
<h2>Danh sách vé đã thanh toán</h2>

<table border="1">
    <thead>
    <tr>
        <th>Mã vé</th>
        <th>Giá</th>
        <th>Trạng thái</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ticket : ${tickets}">
        <td th:text="${ticket.ticketId}">1</td>
        <td th:text="${ticket.price}">100000</td>
        <td th:text="${ticket.status}">Active</td>
    </tr>
    </tbody>
</table>
</body>
</html>
