<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/common/navbar.css}" type="text/css">
<link rel="stylesheet" th:href="@{/common/footer.css}" type="text/css">
<link rel="stylesheet" th:href="@{/member/myTicket.css}" type="text/css">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Vé của tôi</title>
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="myticket-container">
    <h2 class="myticket-title">Danh sách vé</h2>

    <table class="myticket-table">
        <thead>
        <tr>
            <th>Loại vé</th>
            <th>HSD</th>
            <th>Mã vé</th>
            <th>Trạng thái</th>
            <th>Mã QR</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.ticketType != null ? ticket.ticketType.name : '---'}">Loại vé</td>
            <td th:text="${ticket.date_end != null ? #temporals.format(ticket.date_end, 'dd-MM-yyyy') : '---'}">HSD</td>
            <td th:text="${ticket.ticketId}">Mã vé</td>
            <td th:text="${ticket.status}">Trạng thái</td>
            <td th:with="scanTicket=${scanTicketsByTicketId[ticket.ticketId]}">
                <a class="myticket-qr-link"
                   th:if="${scanTicket != null}"
                   th:href="@{/tickets/{code}(code=${scanTicket.code})}">Xem mã vé</a>
                <span th:if="${scanTicket == null}">Chưa có mã</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{common/footer :: footer}"></div>

<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
