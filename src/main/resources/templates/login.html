<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Metro</title>
    <h1>Login</h1>
    <form th:action="login" method="post">
        Phone <input type="text" name="email" th:value="${email}"/>
        <br/>
        <br/>
        Password <input type="password" name="password" th:value="${password}"/>
        <br/>
        <input type="submit" value="login" class="btn"/>
    </form>

    </body>
</head>
</html>
