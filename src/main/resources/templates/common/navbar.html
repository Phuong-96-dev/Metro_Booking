<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Navbar - Metro</title>
    <link rel="stylesheet" th:href="@{/common/navbar.css}" />
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar">
        <div class="logo-container">
            <img th:src="@{/images/metro-logo.png}" alt="Hanoi Metro Logo" class="logo">
        </div>
        <div class="menu-auth-container">
            <ul class="menu">
                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/search-schedules}">Bản đồ</a></li>
                <li><a th:href="@{/blog}">Tin tức</a></li>
                <li><a th:href="@{/ticket}" class="highlight">Vé tàu</a></li>
            </ul>
            <div class="auth-buttons">
                <!-- Nếu chưa đăng nhập -->
                <div th:if="${member == null}">
                    <a th:href="@{/register}" class="signup">Đăng ký</a>
                    <a th:href="@{/login}" class="signin">Đăng nhập</a>
                </div>

                <!-- Nếu đã đăng nhập -->
                <div th:if="${member != null}" class="dropdown">
                    <button class="dropbtn">
                        Chào, <span th:text="${member.name}">User</span>
                    </button>
                    <div class="dropdown-content">


                        <a th:href="@{/profile}">📄Thông tin cá nhân</a>
                        <a th:href="@{/student-verification}">🎓Xác minh sinh viên</a>
                        <a th:href="@{/myTicket}">🎫Vé của tôi</a>
                        <a th:if="${#strings.equalsIgnoreCase(member.role, 'ADMIN')}" th:href="@{/admindashboard}">Quản trị</a>
                        <form th:action="@{/logout}" method="post"><button type="submit" class="logout-button">🚪Đăng xuất</button></form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
