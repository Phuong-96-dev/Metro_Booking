<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Navbar</title>
</head>
<body>
<div th:fragment="navbar">
    <nav class="navbar">
        <div class="logo-container">
            <img th:src="@{/images/metro-logo.png}" alt="Metro Logo">
        </div>
        <div class="menu-auth-container">
            <ul class="menu">
                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/map}">Bản đồ</a></li>
                <li><a th:href="@{/news}">Tin tức</a></li>
                <li><a th:href="@{/ticket}">Vé tàu</a></li>
            </ul>
            <div class="auth-buttons">
                <a th:href="@{/signup}" class="signup">Sign Up</a>
                <a th:href="@{/login}" class="signin">Sign In</a>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
