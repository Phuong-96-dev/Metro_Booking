<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Admin Dashboard - Metro</title>
    <link rel="stylesheet" th:href="@{/common/sidebar.css}" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}" type="text/css">
</head>
<body>

<!-- Container chính sử dụng Bootstrap Grid -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar cố định -->
        <div class="col-md-2 p-0">
            <div th:insert="~{common/sidebar :: sidebar}"></div>
        </div>

        <!-- Nội dung chính -->
        <div class="col-md-10">
            <div class="content">
                <h2>Dashboard Tổng Quan</h2>

                <div class="row mt-4">
                    <div class="col-md-3 mb-4">
                        <div class="card p-3 text-center">
                            <i class="fa fa-ticket-alt fa-2x mb-2 text-primary"></i>
                            <h5>Vé bán</h5>
                            <p th:text="${ticketCount}">0</p>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="card p-3 text-center">
                            <i class="fa fa-train fa-2x mb-2 text-success"></i>
                            <h5>Ga Tàu</h5>
                            <p th:text="${trainStationCount}">0</p>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="card p-3 text-center">
                            <i class="fa fa-bus fa-2x mb-2 text-warning"></i>
                            <h5>Tuyến Bus</h5>
                            <p th:text="${busCount}">0</p>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="card p-3 text-center">
                            <i class="fa fa-newspaper fa-2x mb-2 text-danger"></i>
                            <h5>Bài Tin</h5>
                            <p th:text="${blogCount}">0</p>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-3 mb-4">
                        <div class="card p-3 text-center">
                            <i class="fa fa-users fa-2x mb-2 text-info"></i>
                            <h5>Người dùng</h5>
                            <p th:text="${memberCount}">0</p>
                        </div>
                    </div>
                </div>

                <h4 class="mt-5">
                    Thống kê doanh thu
                    <span class="text-success"
                          th:text="| (Tổng: ${#numbers.formatDecimal(totalRevenue,0,'POINT',0,'COMMA')} đ)|">
                        (Tổng: 0 đ)
                    </span>
                </h4>

                <!-- Phần trăm từng loại vé -->
                <div class="mb-4 ms-3">
                    <div th:each="type, iterStat : ${ticketTypeNames}">
                        <span th:if="${totalRevenue > 0}"
                              th:text="|${type}: ${#numbers.formatDecimal((ticketTypeRevenues[iterStat.index] / totalRevenue * 100), 0, 'POINT', 0, 'COMMA')}%|">
                            Vé lượt: 0%
                        </span>
                        <span th:unless="${totalRevenue > 0}">[[${type}]]: 0%</span>
                        <br/>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-8 mb-4">
                        <div class="card p-3">
                            <h5>
                                Doanh thu theo
                                <select class="form-select d-inline w-auto ms-2" id="typeSelect" onchange="changeType(this.value)">
                                    <option value="day" th:selected="${selectedType == 'day'}">Ngày</option>
                                    <option value="month" th:selected="${selectedType == 'month'}">Tháng</option>
                                    <option value="year" th:selected="${selectedType == 'year'}">Năm</option>
                                </select>
                                <span id="dateRange" style="display:none;">
                                    <input type="date" class="form-control d-inline w-auto ms-2" id="startDate" th:value="${selectedStartDate}" />
                                    <input type="date" class="form-control d-inline w-auto ms-2" id="endDate" th:value="${selectedEndDate}" />
                                    <button class="btn btn-primary ms-2" onclick="applyDateRange()">Áp dụng</button>
                                </span>
                            </h5>
                            <canvas id="revenueChart" height="150"></canvas>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card p-3">
                            <h5>Doanh thu chi tiết theo loại vé</h5>
                            <div th:each="type, iterStat : ${ticketTypeNames}">
                                <div class="d-flex justify-content-between">
                                    <span th:text="${type}">Vé</span>
                                    <span th:if="${totalRevenue > 0}"
                                          th:text="|${#numbers.formatDecimal(ticketTypeRevenues[iterStat.index],0,'POINT',0,'COMMA')} đ (${#numbers.formatDecimal(ticketTypeRevenues[iterStat.index] / totalRevenue * 100, 0, 'POINT', 0, 'COMMA')}%)|">
                                        0 đ (0%)
                                    </span>
                                    <span th:unless="${totalRevenue > 0}"
                                          th:text="|${#numbers.formatDecimal(ticketTypeRevenues[iterStat.index],0,'POINT',0,'COMMA')} đ (0%)|">
                                        0 đ (0%)
                                    </span>
                                </div>
                                <div class="progress mb-2">
                                    <div class="progress-bar"
                                         th:classappend="${iterStat.index % 3 == 0} ? 'bg-success' : (${iterStat.index % 3 == 1} ? 'bg-info' : 'bg-warning')"
                                         th:style="|width: ${totalRevenue > 0 ? (ticketTypeRevenues[iterStat.index] / totalRevenue * 100) : 0}%|"
                                         th:title="|Doanh thu: ${#numbers.formatDecimal(ticketTypeRevenues[iterStat.index],0,'POINT',0,'COMMA')} đ|">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function changeType(type) {
        if (type === 'day') {
            document.getElementById('dateRange').style.display = 'inline';
        } else {
            window.location.href = '/admindashboard?type=' + type;
        }
    }

    function applyDateRange() {
        let start = document.getElementById('startDate').value;
        let end = document.getElementById('endDate').value;
        if (!start || !end) {
            alert("Vui lòng chọn cả từ ngày và đến ngày.");
            return;
        }
        window.location.href = `/admindashboard?type=day&startDate=${start}&endDate=${end}`;
    }

    window.onload = function() {
        if ("[[${selectedType}]]" === "day") {
            document.getElementById('dateRange').style.display = 'inline';
        }
    }
</script>
<script th:inline="javascript">
    let months = /*[[${months}]]*/ [];
    let monthlyRevenue = /*[[${monthlyRevenue}]]*/ [];

    const ctx = document.getElementById('revenueChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: months,
            datasets: [{
                label: 'Doanh thu',
                data: monthlyRevenue,
                fill: true,
                backgroundColor: 'rgba(75,192,192,0.2)',
                borderColor: 'rgba(75,192,192,1)',
                tension: 0.4,
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value) {
                            return value.toLocaleString('vi-VN') + ' đ';
                        }
                    }
                }
            }
        }
    });
</script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
