<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Tin tức - Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Danh sách Tin tức</h2>

    <div class="row">
        <div class="col-md-6 mb-4" th:each="news : ${newsList}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${news.title}">Tiêu đề bài viết</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${#dates.format(news.publishedDate, 'dd/MM/yyyy')}">
                        Ngày đăng
                    </h6>
                    <p class="card-text" th:text="${news.summary}">Đây là đoạn tóm tắt nội dung bài viết...</p>
                    <a th:href="@{/news/{id}(id=${news.id})}" class="btn btn-primary">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
