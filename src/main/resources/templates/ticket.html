<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách các loại vé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}">
    <link rel="stylesheet" th:href="@{/common/footer.css}">
    <link rel="stylesheet" th:href="@{/train/ticker.css}" type="text/css">

</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="ticket-page">
    <div class="container mt-4">

        <h2><i class="bi bi-ticket-perforated-fill ticket-icon"></i>Vé lượt</h2>

        <!-- Search bar -->
        <form class="mb-4 row" th:action="@{/ticket/search}" method="get">
            <div class="col-md-5">
                <label for="stationStart">Ga đi</label>
                <select id="stationStart" name="start" class="form-select">
                    <option value="">Chọn Ga đi</option>
                    <option th:each="station : ${stations}"
                            th:value="${station.stationId}"
                            th:text="${station.name}">
                    </option>
                </select>
            </div>
            <div class="col-md-5">
                <label for="stationEnd">Ga đến</label>
                <select id="stationEnd" name="end" class="form-select">
                    <option value="">Chọn Ga đến</option>
                    <option th:each="station : ${stations}"
                            th:value="${station.stationId}"
                            th:text="${station.name}">
                    </option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Tìm vé</button>
            </div>
        </form>

        <table class="table table-bordered mb-5">
            <thead>
            <tr>
                <th>Tên vé</th>
                <th>Giá</th>
                <th>Ga bắt đầu</th>
                <th>Ga kết thúc</th>
                <th>Mua vé</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="type : ${ticketTypes}" th:if="${type.stationStart != null and type.stationEnd != null}">
                <td th:text="${type.name}"></td>
                <td th:text="${#numbers.formatDecimal(type.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                <td th:text="${type.stationStart.name}"></td>
                <td th:text="${type.stationEnd.name}"></td>
                <td>
                    <form th:action="@{/ticket/buy}" method="post">
                        <input type="hidden" name="ticketTypeId" th:value="${type.ticketTypeId}" />
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-cart-plus-fill"></i> Mua vé
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Vé theo thời gian -->
        <div th:if="${!isSearch}">
            <h2><i class="bi bi-clock-fill ticket-icon"></i>Vé theo thời gian (3 ngày, tuần, tháng)</h2>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Tên vé</th>
                    <th>Giá</th>
                    <th>Thời hạn (ngày)</th>
                    <th>Mua vé</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="type : ${ticketTypes}" th:if="${type.stationStart == null and type.stationEnd == null}">
                    <td th:text="${type.name}"></td>
                    <td th:text="${#numbers.formatDecimal(type.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${type.durationDays} + ' ngày'"></td>
                    <td>
                        <form th:action="@{/ticket/buy}" method="post">
                            <input type="hidden" name="ticketTypeId" th:value="${type.ticketTypeId}" />
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-cart-plus-fill"></i> Mua vé
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
