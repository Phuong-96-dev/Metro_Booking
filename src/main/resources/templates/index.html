<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ METRO</title>
    <link rel="stylesheet" th:href="@{/style.css}" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/common/footer.css}" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>

<div class="container mt-4">
    <!-- Banner -->
    <div class="row">
        <div class="col-md-6 d-flex flex-column justify-content-center">
            <h2 class="mb-3">CHÀO MỪNG ĐẾN VỚI TÀU METRO</h2>
            <p>Catch deals with Simplicity, Value, And Your Good health in mind.</p>
            <a href="/more" class="btn btn-primary mt-2">Xem thêm</a>
        </div>
        <div class="col-md-6">
            <img src="/images/metro-line.png" alt="Metro line" class="img-fluid">
        </div>
    </div>

    <!-- Form tìm chuyến tàu -->
    <div class="card mt-5 p-4">
        <form th:action="@{/search-schedules}" method="post" class="row g-3 align-items-end">
            <div class="col-md-5">
                <label for="startStationId" class="form-label">Ga đi</label>
                <select name="startStationId" id="startStationId" class="form-select" required>
                    <option value="">Chọn Ga Bắt Đầu</option>
                    <option th:each="station : ${stations}"
                            th:value="${station.stationId}"
                            th:text="${station.name}"></option>
                </select>
            </div>
            <div class="col-md-5">
                <label for="endStationId" class="form-label">Ga đến</label>
                <select name="endStationId" id="endStationId" class="form-select" required>
                    <option value="">Chọn Ga Kết Thúc</option>
                    <option th:each="station : ${stations}"
                            th:value="${station.stationId}"
                            th:text="${station.name}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-warning w-100">Tìm chuyến tàu</button>
            </div>
        </form>
    </div>

    <!-- Sơ đồ tuyến -->
    <div class="mt-5 text-center">
        <img src="/images/metro-map.png" alt="Sơ đồ tuyến Metro" class="img-fluid">
    </div>

    <!-- Đánh giá -->

    <div class="mt-5">
        <h4>Đánh giá của khách hàng sử dụng dịch vụ đặt vé tàu METRO</h4>
        <p>
            Xếp hạng <strong th:text="${#numbers.formatDecimal(averageRating, 1, 1)} + '/5'"></strong>
            &nbsp;|&nbsp;
            Đánh giá <strong th:text="${totalFeedback} + ' lượt'"></strong>
        </p>

        <div class="row mt-3">
            <div class="col-md-4 mb-3" th:each="fb : ${feedbacks}">
                <div class="card p-3 h-100">
                    <div>
                    <span th:each="i : ${#numbers.sequence(1, T(java.lang.Math).floor(fb.rating))}">
                        <i class="fa fa-star text-warning"></i>
                    </span>
                        <span th:if="${fb.rating % 1 >= 0.5}">
                        <i class="fa fa-star-half-alt text-warning"></i>
                    </span>
                    </div>
                    <h6 class="mt-2" th:text="${fb.title}">Tiêu đề</h6>
                    <p th:text="${fb.content}">Nội dung feedback</p>
                    <small th:text="'Ngày đăng: ' + ${fb.postingDate}">Ngày đăng</small>
                </div>
            </div>
        </div>
    </div>
    <div class="text-center mt-4">
        <a th:href="@{/feedback/all}" class="btn btn-outline-primary">
            Xem tất cả đánh giá
            <i class="fa fa-arrow-right ms-2"></i>
        </a>
    </div>

<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
