<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Bus Route Detail</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
  <link rel="stylesheet" th:href="@{/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/navbar.css}">
  <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Bus Route Detail</h1>
<div th:if="${bus != null}">
  <h2>Bus Route Information</h2>
  <p>
    ID: <span th:text="${bus.busId}"></span><br>
    Name: <span th:text="${bus.name}"></span><br>
    Location: <span th:text="${bus.location}"></span><br>
    Status: <span th:text="${bus.busStatus}"></span><br>
  </p>
  <h3>Station Information</h3>
  <p th:if="${bus.station != null}">
    Station ID: <span th:text="${bus.station.stationId}"></span><br>
    Name: <span th:text="${bus.station.name}"></span><br>
    Arrival Time: <span th:text="${bus.station.arrivalTime}"></span><br>
    Note: <span th:text="${bus.station.note}"></span><br>
    Position: <span th:text="${bus.station.position}"></span><br>
  </p>
  <p th:unless="${bus.station != null}">No Station Assigned</p>
  <h3>Destinations</h3>
  <table th:if="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}">
    <tr>
      <th>Destination ID</th>
      <th>Destination Name</th>
      <th>Estimated Minutes</th>
      <th>Bus Route ID</th>
    </tr>
    <tr th:each="destination : ${bus.destinations}">
      <td th:text="${destination.id}"></td>
      <td th:text="${destination.destination}"></td>
      <td th:text="${destination.estimatedMinutes}"></td>
      <td th:text="${destination.busRoute?.busId}"></td>
    </tr>
  </table>
  <p th:unless="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}">No Destinations Available</p>
</div>
<p th:unless="${bus != null}">Bus Route not found</p>
<a href="/bus-routes">Back to List</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
