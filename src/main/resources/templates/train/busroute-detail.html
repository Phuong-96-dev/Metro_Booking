<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Route Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
  <link rel="stylesheet" th:href="@{/bus/busDetail.css}" type="text/css">

</head>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 p-0">
      <div th:replace="~{common/sidebar :: sidebar}"></div>
    </div>

    <div class="col-md-10 p-4 bg-light min-vh-100">
      <div class="bus-detail card shadow-sm p-4">
        <h2 class="mb-4 text-primary fw-bold">Thông tin tuyến bus</h2>
        <div class="mb-4">
          <p><strong>ID:</strong> <span th:text="${bus.busId}"></span></p>
          <p><strong>Tên tuyến:</strong> <span th:text="${bus.name}"></span></p>
          <p><strong>Khu vực:</strong> <span th:text="${bus.location}"></span></p>
          <p><strong>Trạng thái:</strong> <span th:text="${bus.busStatus}"></span></p>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="text-secondary fw-semibold">Danh sách điểm dừng</h4>
          <button th:if="${isAdmin}" type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#destinationModal"
                  th:attr="data-mode='create',data-bus-id=${bus.busId}">
            <i class="fas fa-plus-circle"></i> Thêm điểm dừng
          </button>
        </div>

        <div th:if="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}">
          <table class="table table-hover table-bordered align-middle">
            <thead class="table-primary text-center">
            <tr>
              <th>#</th>
              <th>Điểm dừng</th>
              <th>Thời gian (phút)</th>
              <th>ID Tuyến</th>
              <th th:if="${isAdmin}">Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="destination, iter : ${bus.destinations}">
              <td th:text="${iter.index + 1}" class="text-center"></td>
              <td th:text="${destination.destination}"></td>
              <td th:text="${destination.estimatedMinutes}" class="text-center"></td>
              <td th:text="${destination.busRoute?.busId}" class="text-center"></td>
              <td th:if="${isAdmin}" class="text-center">
                <button type="button" class="btn btn-warning btn-sm me-2" data-bs-toggle="modal"
                        data-bs-target="#destinationModal"
                        th:attr="data-mode='edit',data-destination-id=${destination.id},
                             data-destination-name=${destination.destination},
                             data-estimated-minutes=${destination.estimatedMinutes},
                             data-bus-id=${bus.busId}">
                  <i class="fas fa-edit"></i>
                </button>
                <form th:action="@{/bus-routes/{busId}/destinations/delete/{id}(busId=${bus.busId},id=${destination.id})}"
                      method="post" style="display:inline;">
                  <button type="submit" class="btn btn-danger btn-sm"
                          onclick="return confirm('Bạn chắc chắn muốn xoá điểm dừng này?')">
                    <i class="fas fa-trash-alt"></i>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
        <p th:unless="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}" class="text-muted">Chưa có điểm dừng nào.</p>

<!--        <a href="/bus-routes" class="btn btn-outline-secondary mt-4">-->
<!--          <i class="fas fa-arrow-left"></i> Quay lại danh sách-->
<!--        </a>-->
      </div>
    </div>


<!-- Modal for creating/editing destination -->
<div th:if="${isAdmin}" class="modal fade" id="destinationModal" tabindex="-1" aria-labelledby="destinationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="destinationModalLabel">Add/Edit Destination</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="destinationForm" th:action="@{/bus-routes/{busId}/destinations/create(busId=${bus.busId})}" method="post">
          <input type="hidden" name="destinationId" id="destinationId">
          <div class="mb-3">
            <label for="destinationName" class="form-label">Destination Name</label>
            <input type="text" class="form-control" id="destinationName" name="destination" required>
          </div>
          <div class="mb-3">
            <label for="estimatedMinutes" class="form-label">Estimated Minutes</label>
            <input type="number" class="form-control" id="estimatedMinutes" name="estimatedMinutes" required min="1">
          </div>
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
        </div>
        </div>

        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // JavaScript to handle modal for create/edit
  document.addEventListener('DOMContentLoaded', function () {
    const modal = document.getElementById('destinationModal');
    if (!modal) return;
    modal.addEventListener('show.bs.modal', function (event) {
      const button = event.relatedTarget;
      const mode = button.getAttribute('data-mode');
      const busId = button.getAttribute('data-bus-id');
      const form = document.getElementById('destinationForm');
      const modalTitle = modal.querySelector('.modal-title');
      const destinationIdInput = document.getElementById('destinationId');
      const destinationNameInput = document.getElementById('destinationName');
      const estimatedMinutesInput = document.getElementById('estimatedMinutes');

      if (mode === 'edit') {
        modalTitle.textContent = 'Edit Destination';
        form.action = `/bus-routes/${busId}/destinations/edit/${button.getAttribute('data-destination-id')}`;
        destinationIdInput.value = button.getAttribute('data-destination-id');
        destinationNameInput.value = button.getAttribute('data-destination-name');
        estimatedMinutesInput.value = button.getAttribute('data-estimated-minutes');
      } else {
        modalTitle.textContent = 'Add New Destination';
        form.action = `/bus-routes/${busId}/destinations/create`;
        destinationIdInput.value = '';
        destinationNameInput.value = '';
        estimatedMinutesInput.value = '';
      }
    });
  });
</script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
