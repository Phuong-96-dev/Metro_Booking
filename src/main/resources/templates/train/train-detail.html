<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết Tàu</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}">
    <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Chi tiết Tàu</h1>
<div th:if="${train != null}">
    <h2>Thông tin Tàu</h2>
    <p>
        ID: <span th:text="${train.trainId}"></span><br>
        Tên: <span th:text="${train.name}"></span><br>
    </p>
    <h3>Thông tin Quản trị viên</h3>
    <p th:if="${train.admin != null}">
        ID Quản trị viên: <span th:text="${train.admin.memberId}"></span><br>
        Tên: <span th:text="${train.admin.name}"></span><br>
        Email: <span th:text="${train.admin.email}"></span><br>
        Điện thoại: <span th:text="${train.admin.phone}"></span><br>
        Vai trò: <span th:text="${train.admin.role}"></span><br>
    </p>
    <p th:unless="${train.admin != null}">Chưa có Quản trị viên được chỉ định</p>
    <h3>Lịch trình</h3>
    <table th:if="${train.schedules != null and not #lists.isEmpty(train.schedules)}">
        <tr>
            <th>ID Lịch trình</th>
            <th>Giờ Khởi hành</th>
            <th>Giờ Đến</th>
            <th>Hướng đi</th>
            <th>ID Tàu</th>
        </tr>
        <tr th:each="schedule : ${train.schedules}">
            <td th:text="${schedule.scheduleId}"></td>
            <td th:text="${#temporals.format(schedule.departTime, 'HH:mm')}"></td>
            <td th:text="${#temporals.format(schedule.arrivalTime, 'HH:mm')}"></td>
            <td th:text="${schedule.startStation.name} + ' → ' + ${schedule.endStation.name}"></td>
            <td th:text="${schedule.train?.trainId}"></td>
        </tr>
    </table>
    <p th:unless="${train.schedules != null and not #lists.isEmpty(train.schedules)}">Không có lịch trình</p>
</div>
<p th:unless="${train != null}">Không tìm thấy tàu</p>
<a href="/trains">Quay lại Danh sách</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
