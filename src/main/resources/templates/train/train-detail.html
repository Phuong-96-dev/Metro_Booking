<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Train Detail</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
</head>
<body>
<h1>Train Detail</h1>
<div th:if="${train != null}">
    <h2>Train Information</h2>
    <p>
        ID: <span th:text="${train.trainId}"></span><br>
        Name: <span th:text="${train.name}"></span><br>
    </p>
    <h3>Admin Information</h3>
    <p th:if="${train.admin != null}">
        Admin ID: <span th:text="${train.admin.adminId}"></span><br>
        Name: <span th:text="${train.admin.name}"></span><br>
        Email: <span th:text="${train.admin.email}"></span><br>
        Phone: <span th:text="${train.admin.phone}"></span><br>
        Role: <span th:text="${train.admin.role}"></span><br>
    </p>
    <p th:unless="${train.admin != null}">No Admin Assigned</p>
    <h3>Schedules</h3>
    <table th:if="${train.schedules != null and not #lists.isEmpty(train.schedules)}">
        <tr>
            <th>Schedule ID</th>
            <th>Start Time</th>
            <th>Depart Time</th>
            <th>Arrival Time</th>
            <th>Station Start</th>
            <th>Station End</th>
            <th>Train ID</th>
            <th>Stations</th>
        </tr>
        <tr th:each="schedule : ${train.schedules}">
            <td th:text="${schedule.scheduleId}"></td>
            <td th:text="${schedule.startTime}"></td>
            <td th:text="${schedule.departTime}"></td>
            <td th:text="${schedule.arrivalTime}"></td>
            <td th:text="${schedule.stationStart}"></td>
            <td th:text="${schedule.stationEnd}"></td>
            <td th:text="${schedule.train?.trainId}"></td>
            <td>
                <span th:if="${schedule.stations != null and not #lists.isEmpty(schedule.stations)}"
                      th:utext="${#strings.listJoin(schedule.stations.![name], ', ')}"></span>
                <span th:unless="${schedule.stations != null and not #lists.isEmpty(schedule.stations)}">No Stations</span>
            </td>
        </tr>
    </table>
    <p th:unless="${train.schedules != null and not #lists.isEmpty(train.schedules)}">No Schedules Available</p>
</div>
<p th:unless="${train != null}">Train not found</p>
<a href="/trains">Back to List</a>
</body>
</html>
