<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Train Station Detail</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
  <link rel="stylesheet" th:href="@{/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/navbar.css}">
  <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Train Station Detail</h1>
<div th:if="${station != null}">
  <h2>Station Information</h2>
  <p>
    ID: <span th:text="${station.stationId}"></span><br>
    Name: <span th:text="${station.name}"></span><br>
    Arrival Time: <span th:text="${station.arrivalTime}"></span><br>
    Note: <span th:text="${station.note != null} ? ${station.note} : 'No Note'"></span><br>
    Position: <span th:text="${station.position}"></span><br>
  </p>
  <h3>Bus Routes</h3>
  <table th:if="${station.busRoutes != null and not #lists.isEmpty(station.busRoutes)}">
    <tr>
      <th>Bus Route ID</th>
      <th>Name</th>
      <th>Location</th>
      <th>Status</th>
    </tr>
    <tr th:each="busRoute : ${station.busRoutes}">
      <td th:text="${busRoute.busId}"></td>
      <td th:text="${busRoute.name}"></td>
      <td th:text="${busRoute.location != null} ? ${busRoute.location} : 'No Location'"></td>
      <td th:text="${busRoute.busStatus != null} ? ${busRoute.busStatus} : 'No Status'"></td>
    </tr>
  </table>
  <p th:unless="${station.busRoutes != null and not #lists.isEmpty(station.busRoutes)}">No Bus Routes Available</p>
</div>
<p th:unless="${station != null}">Station not found</p>
<a href="/train-stations">Back to List</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
