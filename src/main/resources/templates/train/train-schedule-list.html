<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Train Schedule List</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
  <link rel="stylesheet" th:href="@{/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/navbar.css}">
  <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h2>Xem danh sách các tàu :<a href="/trains">View</a></h2>
<h2>Xem danh sách các ga metro:<a href="/train-stations">View</a></h2>
<h1>Train Schedules</h1>
<a href="/train-schedules/add">Add New Schedule</a>
<table>
  <tr>
    <th>ID</th>
    <th>Depart Time</th>
    <th>Arrival Time</th>
    <th>Station Start</th>
    <th>Station End</th>
    <th>Train</th>
    <th>Action</th>
  </tr>
  <tr th:each="schedule : ${schedules}">
    <td th:text="${schedule.scheduleId}"></td>
    <td th:text="${#temporals.format(schedule.departTime, 'HH:mm')}"></td>
    <td th:text="${#temporals.format(schedule.arrivalTime, 'HH:mm')}"></td>
    <td th:text="${schedule.startStation.name}"></td>
    <td th:text="${schedule.endStation.name}"></td>
    <td th:text="${schedule.train != null} ? ${schedule.train.name} : 'No Train'"></td>
    <td>
      <a th:href="@{/train-schedules/edit/{id}(id=${schedule.scheduleId})}">Edit</a>
      <a th:href="@{/train-schedules/delete/{id}(id=${schedule.scheduleId})}" onclick="return confirm('Are you sure?')">Delete</a>
    </td>
  </tr>
</table>
<a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
