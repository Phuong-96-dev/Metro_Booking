<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản lý lịch trình tàu hỏa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/sidebar.css}">
  <link rel="stylesheet" th:href="@{/train/train-schedule-list.css}">
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 p-0">
      <div th:replace="common/sidebar :: sidebar"></div>
    </div>

    <!-- Main content -->
    <div class="col-md-10 p-4">
      <h1>Quản lý lịch trình tàu hỏa</h1>

      <div class="mb-3">
        <a href="/trains" class="btn btn-outline-primary me-2">Xem danh sách tàu</a>
        <a href="/train-stations" class="btn btn-outline-primary">Xem danh sách ga metro</a>
      </div>

      <a href="/train-schedules/add" class="btn btn-success mb-3">Thêm lịch trình</a>

      <table class="table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Depart Time</th>
          <th>Arrival Time</th>
          <th>Station Start</th>
          <th>Station End</th>
          <th>Train</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="schedule : ${schedules}">
          <td th:text="${schedule.scheduleId}"></td>
          <td th:text="${#temporals.format(schedule.departTime, 'HH:mm')}"></td>
          <td th:text="${#temporals.format(schedule.arrivalTime, 'HH:mm')}"></td>
          <td th:text="${schedule.startStation.name}"></td>
          <td th:text="${schedule.endStation.name}"></td>
          <td th:text="${schedule.train != null} ? ${schedule.train.name} : 'No Train'"></td>
          <td>
            <button class="Btn edit-btn" th:onclick="|window.location.href='@{/train-schedules/edit/{id}(id=${schedule.scheduleId})}'|">
              Edit
            </button>
            <button class="Btn delete-btn" th:onclick="|if(confirm('Are you sure?')) window.location.href='@{/train-schedules/delete/{id}(id=${schedule.scheduleId})}'|">
              Delete
            </button>
          </td>
        </tr>
        </tbody>
      </table>

      <a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
