<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Train Schedule List</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/navbar.css}">
  <link rel="stylesheet" th:href="@{/common/footer.css}">
  <link rel="stylesheet" th:href="@{/train/train-schedule-list.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h2>Xem danh sách các tàu :<a href="/trains">View</a></h2>
<h2>Xem danh sách các ga metro:<a href="/train-stations">View</a></h2>
<h1>Lịch trình tàu hỏa </h1>
<a href="/train-schedules/add">Thêm lịch trình</a>
<table>
  <tr>
    <th>ID</th>
    <th>Start Time</th>
    <th>Depart Time</th>
    <th>Arrival Time</th>
    <th>Station Start</th>
    <th>Station End</th>
    <th>Train</th>
    <th>Action</th>
  </tr>
  <tr th:each="schedule : ${schedules}">
    <td th:text="${schedule.scheduleId}"></td>
    <td th:text="${schedule.startTime}"></td>
    <td th:text="${schedule.departTime}"></td>
    <td th:text="${schedule.arrivalTime}"></td>
    <td th:text="${schedule.startStation.name}"></td>
    <td th:text="${schedule.endStation.name}"></td>
    <td th:text="${schedule.train != null} ? ${schedule.train.name} : 'No Train'"></td>
    <td>
      <button class="Btn edit-btn" th:onclick="|window.location.href='@{/train-schedules/edit/{id}(id=${schedule.scheduleId})}'|">
        Edit
        <svg class="svg" viewBox="0 0 512 512">
          <path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"></path>
        </svg>
      </button>
      <button class="Btn delete-btn" th:onclick="|if(confirm('Are you sure?')) window.location.href='@{/train-schedules/delete/{id}(id=${schedule.scheduleId})}'|">
        Delete
        <svg class="svg" viewBox="0 0 512 512">
          <path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"></path>
        </svg>
      </button>
    </td>
  </tr>
</table>
<a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
