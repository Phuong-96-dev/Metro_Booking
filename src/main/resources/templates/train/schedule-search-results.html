<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kết quả Tra cứu Lịch Trình</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}">
    <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Kết quả Tra cứu Lịch Trình</h1>
<table>
    <tr>
        <th>ID Lịch trình</th>
        <th>Tàu</th>
        <th>Thời gian khởi hành</th>
        <th>Thời gian đến</th>
        <th>Thời gian di chuyển (phút)</th>
    </tr>
    <tr th:each="result : ${results}">
        <td th:text="${result.schedule.scheduleId}"></td>
        <td th:text="${result.schedule.train != null} ? ${result.schedule.train.name} : 'Không có tàu'"></td>
        <td th:text="${result.schedule.departTime}"></td>
        <td th:text="${result.schedule.arrivalTime}"></td>
        <td th:text="${result.travelMinutes}"></td>
    </tr>
</table>
<a href="/search-schedules">Tra cứu lại</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
