<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Train List</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{common/sidebar :: sidebar}"></div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h1>Trains</h1>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>

                    <th>Lịch trình</th>
                    <th>Hoạt động</th>
                </tr>
                <tr th:each="train : ${trains}">
                    <td th:text="${train.trainId}"></td>
                    <td th:text="${train.name}"></td>

                    <td>
                        <span th:if="${train.schedules != null and not #lists.isEmpty(train.schedules)}"
                              th:utext="${#strings.listJoin(train.schedules.![scheduleId], ', ')}"></span>
                        <span th:unless="${train.schedules != null and not #lists.isEmpty(train.schedules)}">No Schedules</span>
                    </td>
                    <td><a th:href="@{/trains/{id}(id=${train.trainId})}">View</a></td>
                </tr>
            </table>
            <a href="/train-schedules" class="btn btn-secondary mt-3">Back</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
