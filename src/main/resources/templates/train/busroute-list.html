<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tuyến xe buýt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="common/sidebar :: sidebar"></div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h1>Danh sách tuyến xe buýt</h1>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Vị trí</th>
                    <th>Trạng thái</th>
                    <th>Ga</th>
                    <th>Điểm đến</th>
                    <th>Chức năng</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bus : ${buses}">
                    <td th:text="${bus.busId}"></td>
                    <td th:text="${bus.name}"></td>
                    <td th:text="${bus.location}"></td>
                    <td th:text="${bus.busStatus}"></td>
                    <td th:text="${bus.station != null} ? ${bus.station.name} : 'No Station'"></td>
                    <td>
                        <span th:if="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}"
                              th:utext="${#strings.listJoin(bus.destinations.![destination], ', ')}"></span>
                        <span th:unless="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}">No Destinations</span>
                    </td>
                    <td><a th:href="@{/bus-routes/{id}(id=${bus.busId})}" class="btn btn-sm btn-primary">Xem</a></td>
                </tr>
                </tbody>
            </table>

            <a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
