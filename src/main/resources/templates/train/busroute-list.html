<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bus Route List</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/navbar.css}">
    <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Bus Routes</h1>
<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Status</th>
        <th>Station Name</th>
        <th>Destinations</th>
        <th>Action</th>
    </tr>
    <tr th:each="bus : ${buses}">
        <td th:text="${bus.busId}"></td>
        <td th:text="${bus.name}"></td>
        <td th:text="${bus.location}"></td>
        <td th:text="${bus.busStatus}"></td>
        <td th:text="${bus.station != null} ? ${bus.station.name} : 'No Station'"></td>
        <td>
            <span th:if="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}"
                  th:utext="${#strings.listJoin(bus.destinations.![destination], ', ')}"></span>
            <span th:unless="${bus.destinations != null and not #lists.isEmpty(bus.destinations)}">No Destinations</span>
        </td>
        <td><a th:href="@{/bus-routes/{id}(id=${bus.busId})}">View</a></td>
    </tr>
</table>
<a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>
<div th:replace="~{common/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
