<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tuyến xe buýt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <link rel="stylesheet" th:href="@{/bus/busList.css}" type="text/css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="common/sidebar :: sidebar"></div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h1>Danh sách tuyến xe buýt</h1>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Ga</th>
                    <th>Vị trí</th>
                    <th>Chi tiết</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bus : ${buses}">
                    <td th:text="${bus.busId}"></td>
                    <td th:text="${bus.name}"></td>
                    <td th:text="${bus.station != null} ? ${bus.station.name} : 'No Station'"></td>
                    <td th:text="${bus.location}"></td>
                    <td>
                        <a th:href="@{/bus-routes/{id}(id=${bus.busId})}" class="Btn">
                            <div class="svgWrapper">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 42 42" class="svgIcon">
                                    <path stroke-width="5" stroke="#fff" d="M9.14073 2.5H32.8593C33.3608 2.5 33.8291 2.75065 34.1073 3.16795L39.0801 10.6271C39.3539 11.0378 39.5 11.5203 39.5 12.0139V21V37C39.5 38.3807 38.3807 39.5 37 39.5H5C3.61929 39.5 2.5 38.3807 2.5 37V21V12.0139C2.5 11.5203 2.6461 11.0378 2.91987 10.6271L7.89266 3.16795C8.17086 2.75065 8.63921 2.5 9.14073 2.5Z"></path>
                                    <rect stroke-width="3" stroke="#fff" rx="2" height="4" width="11" y="18.5" x="15.5"></rect>
                                    <path stroke-width="5" stroke="#fff" d="M1 12L41 12"></path>
                                </svg>
                                <div class="text">Xem</div>
                            </div>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

<!--            <a href="/admindashboard" class="btn btn-secondary mt-3">Back</a>-->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
