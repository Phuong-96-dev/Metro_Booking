<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Train Station List</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 5px;
    }
  </style>
  <link rel="stylesheet" th:href="@{/style.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/navbar.css}">
  <link rel="stylesheet" th:href="@{/common/footer.css}">
</head>
<body>
<!-- Navbar -->
<div th:replace="~{common/navbar :: navbar}"></div>
<h1>Train Stations</h1>
<table>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Arrival Time</th>
    <th>Note</th>
    <th>Position</th>
    <th>Action</th>
  </tr>
  <tr th:each="station : ${trainStations}">
    <td th:text="${station.stationId}"></td>
    <td th:text="${station.name}"></td>
    <td th:text="${station.arrivalTime}"></td>
    <td th:text="${station.note != null} ? ${station.note} : 'No Note'"></td>
    <td th:text="${station.position}"></td>
    <td><a th:href="@{/train-stations/{id}(id=${station.stationId})}">View</a></td>
  </tr>
</table>
<a href="/train-schedules" class="btn btn-secondary mt-3">Back</a>
<!-- Footer -->
<div th:replace="~{common/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
