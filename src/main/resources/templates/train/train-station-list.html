<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Station List</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/common/sidebar.css}">
  <style>
    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      table-layout: fixed;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      background-color: #ffffff;
    }

    th, td {
      border: 1px solid #dee2e6;
      padding: 12px;
      text-align: center;
      vertical-align: middle;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    th {
      background-color: #f1f3f5;
      font-weight: bold;
    }

    td:nth-child(5) { /* Position column */
      max-width: 300px;
      white-space: normal;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 p-0">
      <div th:replace="~{common/sidebar :: sidebar}"></div>
    </div>

    <!-- Main content -->
    <div class="col-md-10 p-4">
      <h1>Nhà ga</h1>
      <table>
        <tr>
          <th>ID</th>
          <th>Tên</th>
          <th>Thời gian</th>
          <th>Note</th>
          <th>Hoạt động</th>
        </tr>
        <tr th:each="station : ${trainStations}">
          <td th:text="${station.stationId}"></td>
          <td th:text="${station.name}"></td>
          <td th:text="${station.arrivalTime}"></td>
          <td th:text="${station.note != null} ? ${station.note} : 'No Note'"></td>
          <td>
            <a th:href="@{/train-stations/{id}(id=${station.stationId})}" class="btn btn-sm btn-outline-primary">
              View
            </a>
          </td>
        </tr>
      </table>
      <a href="/train-schedules" class="btn btn-secondary mt-3">Back</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
