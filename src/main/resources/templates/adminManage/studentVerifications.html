<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duyệt xác minh sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <link rel="stylesheet" th:href="@{/member/studentVerification.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 p-0"><div th:replace="~{common/sidebar :: sidebar}"></div></div>
        <main class="col-md-10 p-4 verification-page">
            <h1>Yêu cầu xác minh sinh viên</h1>
            <form method="get" th:action="@{/admin/student-verifications}" class="row g-2 mb-4">
                <div class="col-md-3">
                    <select class="form-select" name="status">
                        <option value="">Tất cả trạng thái</option>
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">PENDING</option>
                        <option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">APPROVED</option>
                        <option value="REJECTED" th:selected="${selectedStatus == 'REJECTED'}">REJECTED</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input class="form-control" type="search" name="q" placeholder="Tên, email hoặc mã sinh viên"
                           th:value="${searchTerm}">
                </div>
                <div class="col-md-3"><button class="btn btn-primary" type="submit">Lọc</button></div>
            </form>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead><tr><th>Người dùng</th><th>Email</th><th>Mã sinh viên</th><th>Trường</th><th>Trạng thái</th><th>Ngày gửi</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${verifications}">
                        <td th:text="${item.member.name}"></td>
                        <td th:text="${item.member.email}"></td>
                        <td th:text="${item.studentCode}"></td>
                        <td th:text="${item.schoolName}"></td>
                        <td><span class="status-badge" th:classappend="${'status-' + #strings.toLowerCase(item.status)}"
                                  th:text="${item.status}"></span></td>
                        <td th:text="${item.submittedAt}"></td>
                        <td><a class="btn btn-sm btn-outline-primary"
                               th:href="@{/admin/student-verifications/{id}(id=${item.id})}">Chi tiết</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(verifications)}"><td colspan="7" class="text-center">Không có hồ sơ phù hợp.</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
