<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Manage Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <link rel="stylesheet" th:href="@{/admin/manageMember.css}">

    <style>
        .role-admin {
            color: #dc3545;
            font-weight: bold;
        }
        .badge-status {
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{common/sidebar :: sidebar}"></div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 p-4">
            <h2 class="mb-4 text-center">Member Management</h2>

            <!-- Hiển thị thông báo -->
            <div th:if="${param.message}" class="alert alert-success" th:text="${param.message}"></div>
            <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Student Card</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>School</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Tickets Bought</th>
                    <th>Total Paid</th>
<!--                    <th>Update Role</th>-->
                    <th>Update Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberId}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.studentCard}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone}"></td>
                    <td th:text="${member.schoolName}"></td>

                    <td>
                        <span th:if="${member.role.equalsIgnoreCase('ADMIN')}"
                              class="badge bg-danger badge-status" th:text="${member.role}"></span>
                        <span th:unless="${member.role.equalsIgnoreCase('ADMIN')}"
                              class="badge bg-secondary badge-status" th:text="${member.role}"></span>
                    </td>

                    <td>
                        <span th:if="${member.status.equalsIgnoreCase('ACTIVE')}"
                              class="badge bg-success badge-status" th:text="${member.status}"></span>
                        <span th:unless="${member.status.equalsIgnoreCase('ACTIVE')}"
                              class="badge bg-warning text-dark badge-status" th:text="${member.status}"></span>
                    </td>

                    <!-- Tickets Bought -->
                    <td th:text="${memberTicketCounts[member.memberId]} ?: 0"></td>
                    <td th:text="${#numbers.formatDecimal(memberTotalPaid[member.memberId] ?: 0, 1, 'POINT', 2, 'COMMA')}"></td>

                    <!-- Update role -->
<!--                    <td>-->
<!--                        <form th:action="@{/adminManage/updateMemberRole}" method="post" class="d-flex gap-1">-->
<!--                            <input type="hidden" name="memberId" th:value="${member.memberId}"/>-->
<!--                            <select name="role" class="form-select form-select-sm" style="width: auto;">-->
<!--                                <option th:selected="${member.role == 'MEMBER'}">MEMBER</option>-->
<!--                                <option th:selected="${member.role == 'ADMIN'}">ADMIN</option>-->
<!--                            </select>-->
<!--                            <button type="submit" class="btn btn-sm btn-primary">Update</button>-->
<!--                        </form>-->
<!--                    </td>-->

                    <!-- Update status -->
                    <td>
                        <form th:action="@{/adminManage/updateMemberStatus}" method="post" class="d-flex gap-1">
                            <input type="hidden" name="memberId" th:value="${member.memberId}"/>
                            <select name="status" class="form-select form-select-sm" style="width: auto;">
                                <option th:selected="${member.status == 'ACTIVE'}">ACTIVE</option>
                                <option th:selected="${member.status == 'INACTIVE'}">INACTIVE</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-success">Update</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
