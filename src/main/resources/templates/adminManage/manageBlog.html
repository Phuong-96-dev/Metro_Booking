<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Quản lý Tin Tức</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/common/sidebar.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h2 {
            font-weight: bold;
            color: #2c3e50;
        }

        .table {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .table thead {
            background-color: #e9ecef;
        }

        .table th, .table td {
            vertical-align: middle;
            text-align: center;
        }

        .table img {
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary, .btn-success, .btn-warning, .btn-danger {
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }

        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: black;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .modal-content {
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            background-color: #f1f1f1;
            border-bottom: 1px solid #dee2e6;
        }

        .modal-footer {
            border-top: 1px solid #dee2e6;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        input.form-control, textarea.form-control {
            border-radius: 8px;
            box-shadow: none;
            border: 1px solid #ced4da;
            transition: border-color 0.3s;
        }

        input.form-control:focus, textarea.form-control:focus {
            border-color: #007bff;
            box-shadow: none;
        }

        #imagePreview {
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 8px;
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="~{common/sidebar :: sidebar}"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <h2 class="mb-4 text-center">Quản lý Tin Tức</h2>

            <!-- Button trigger modal -->
            <div class="mb-3 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBlogModal">
                    Thêm tin tức
                </button>
            </div>

            <!-- Blog Table -->
            <table class="table table-bordered table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề</th>
                    <th>Nội Dung</th>
                    <th>Ảnh</th>
                    <th>Ngày đăng</th>
                    <th>Người đăng</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="blog : ${blogs}">
                    <td th:text="${blog.blogId}"></td>
                    <td th:text="${blog.title}"></td>
                    <td th:text="${blog.content}"></td>
                    <td><img th:src="${blog.imageUrl}" alt="img" style="width:80px; height:auto"></td>
                    <td th:text="${blog.postingDate}"></td>
                    <td th:text="${blog.admin?.name}"></td>
                    <td>
                        <button class="btn btn-sm btn-warning"
                                data-bs-toggle="modal"
                                th:data-bs-target="'#editBlogModal' + ${blog.blogId}">
                            Chỉnh sửa
                        </button>
                        <form th:action="@{/adminManage/deleteBlog/{id}(id=${blog.blogId})}" method="post" style="display:inline" onsubmit="return confirm('Xóa blog này?');">
                            <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Add Blog Modal -->
            <div class="modal fade" id="addBlogModal" tabindex="-1">
                <div class="modal-dialog">
                    <form th:action="@{/adminManage/addBlog}" method="post" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Thêm Blog Mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label>Tiêu đề</label>
                                <input type="text" name="title" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Nội dung</label>
                                <textarea name="content" class="form-control" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label>URL Hình ảnh</label>
                                <input type="text" name="imageUrl" class="form-control" id="imageUrlInput" required
                                       oninput="updateImagePreview()">
                            </div>
                            <div class="mb-3 text-center">
                                <img id="imagePreview" src="" alt="Preview" style="max-width: 200px; display: none;"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Lưu</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Edit Blog Modals -->
            <div th:each="blog : ${blogs}">
                <div class="modal fade" th:id="'editBlogModal' + ${blog.blogId}" tabindex="-1">
                    <div class="modal-dialog">
                        <form th:action="@{/adminManage/updateBlog}" method="post" class="modal-content">
                            <input type="hidden" name="blogId" th:value="${blog.blogId}">
                            <div class="modal-header">
                                <h5 class="modal-title">Chỉnh sửa Blog</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label>Tiêu đề</label>
                                    <input type="text" name="title" th:value="${blog.title}" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label>Nội dung</label>
                                    <textarea name="content" class="form-control" required th:text="${blog.content}"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label>URL Hình ảnh</label>
                                    <input type="text" name="imageUrl" th:value="${blog.imageUrl}" class="form-control" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-primary">Cập nhật</button>
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div> <!-- End Main Content -->
    </div>
</div>

<script>
    function updateImagePreview() {
        const url = document.getElementById('imageUrlInput').value;
        const img = document.getElementById('imagePreview');
        if (url) {
            img.src = url;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
    }
</script>

<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
