<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Blogs</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-5">

    <!-- Nút back + tiêu đề -->
    <div class="row mb-4 align-items-center">
        <div class="col-auto">
            <a th:href="@{/admindashboard}" class="btn btn-secondary">← Back</a>
        </div>
        <div class="col text-center">
            <h2 class="m-0">Quản lý Tin Tức</h2>
        </div>
    </div>

    <!-- Button trigger modal -->
    <div class="mb-3 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBlogModal">
            Thêm tin tức 
        </button>
    </div>

    <!-- Blog Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tiêu đề</th>
            <th>Nội Dung </th>
            <th>Ảnh</th>
            <th>Ngày đăng</th>
            <th>Người đăng</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="blog : ${blogs}">
            <td th:text="${blog.blogId}"></td>
            <td th:text="${blog.title}"></td>
            <td th:text="${blog.content}"></td>
            <td><img th:src="${blog.imageUrl}" alt="img" style="width:80px; height:auto"></td>
            <td th:text="${blog.postingDate}"></td>
            <td th:text="${blog.admin.name}"></td>
            <td>
                <button class="btn btn-sm btn-warning"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#editBlogModal' + ${blog.blogId}">
                    Edit
                </button>
                <a th:href="@{/adminManage/deleteBlog/{id}(id=${blog.blogId})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Xóa blog này?');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Add Blog Modal -->
    <div class="modal fade" id="addBlogModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/adminManage/addBlog}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm Blog Mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Tiêu đề</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Nội dung</label>
                        <textarea name="content" class="form-control" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label>URL Hình ảnh</label>
                        <input type="text" name="imageUrl" class="form-control" id="imageUrlInput" required
                               oninput="updateImagePreview()">
                    </div>
                    <div class="mb-3 text-center">
                        <img id="imagePreview" src="" alt="Preview" style="max-width: 200px; display: none;"/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Lưu</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Blog Modals -->
    <div th:each="blog : ${blogs}">
        <div class="modal fade" th:id="'editBlogModal' + ${blog.blogId}" tabindex="-1">
            <div class="modal-dialog">
                <form th:action="@{/adminManage/updateBlog}" method="post" class="modal-content">
                    <input type="hidden" name="blogId" th:value="${blog.blogId}">
                    <div class="modal-header">
                        <h5 class="modal-title">Chỉnh sửa Blog</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label>Tiêu đề</label>
                            <input type="text" name="title" th:value="${blog.title}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Nội dung</label>
                            <textarea name="content" class="form-control" required th:text="${blog.content}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>URL Hình ảnh</label>
                            <input type="text" name="imageUrl" th:value="${blog.imageUrl}" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

<script>
    function updateImagePreview() {
        const url = document.getElementById('imageUrlInput').value;
        const img = document.getElementById('imagePreview');
        if (url) {
            img.src = url;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
    }
</script>

</body>
</html>
