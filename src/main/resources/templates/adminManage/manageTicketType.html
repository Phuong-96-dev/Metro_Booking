<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách loại vé</title>



    <!-- Nhúng css sidebar -->
    <link rel="stylesheet" th:href="@{/common/sidebar.css}" type="text/css">

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<!-- Thông báo lỗi -->
<div class="alert-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show custom-alert" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show custom-alert" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>
<!-- Container chính sử dụng Bootstrap Grid -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar cố định -->
        <div class="col-md-2 p-0">
            <div th:replace="common/sidebar :: sidebar"></div>
        </div>

        <!-- Nội dung chính -->
        <div class="col-md-10">
            <div class="content">
                <h1>Danh sách các loại vé</h1>

                <h3>Thêm loại vé có thời hạn</h3>
                <form th:action="@{/adminManage/manageTicketType/create}" method="post">
                    <!-- Tên vé nhập tự do -->
                    <label>Tên vé:
                        <input type="text" name="name" required />
                    </label>

                    <!-- Giá vé -->
                    <label>Giá:
                        <input type="number" name="price" required min="0" />
                    </label>

                    <!-- Thời hạn sử dụng (số ngày) -->
                    <label>Thời hạn (ngày):
                        <input type="number" name="durationDays" required min="1" />
                    </label>

                    <button type="submit">Thêm Vé</button>
                </form>

                <!-- ✅ Form thêm mới -->
                <h3>Thêm loại vé mới</h3>
                <form th:action="@{/adminManage/manageTicketType/create}" method="post">
                    <!-- Tên vé cố định -->
                    <p>Loại vé: <strong>Vé lượt</strong></p>
                    <input type="hidden" name="name" value="Vé lượt" />

                    <!-- Giá có thể điều chỉnh -->
                    <label>Giá:
                        <input type="number" name="price" required min="0" />
                    </label>

                    <!-- Ga đi -->
                    <label>Ga đi:
                        <select name="stationStartId" required>
                            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                        </select>
                    </label>

                    <!-- Ga đến -->
                    <label>Ga đến:
                        <select name="stationEndId" required>
                            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                        </select>
                    </label>

                    <button type="submit">Thêm Vé</button>
                </form>

                <!-- ✅ Danh sách và chỉnh sửa -->
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên vé</th>
                        <th>Giá</th>
                        <th>Thời hạn</th>
                        <th>Ga đi</th>
                        <th>Ga đến</th>
                        <th>Chức năng</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${ticketTypes}">
                        <td th:text="${ticket.ticketTypeId}"></td>
                        <td>
                            <form th:action="@{/adminManage/manageTicketType/update/{id}(id=${ticket.ticketTypeId})}" method="post" class="edit-form">
                                <input type="text" name="name" th:value="${ticket.name}" required />
                        </td>
                        <td>
                            <input type="number" name="price" th:value="${ticket.price}" required />
                        </td>
                        <td th:if="${ticket.name != 'Vé lượt'}">
                            <input type="number" name="durationDays" th:value="${ticket.durationDays}" required />
                        </td>

                        <td th:if="${ticket.name == 'Vé lượt'}">-</td>

                        <td>
                            <select name="stationStartId"
                                    th:if="${ticket.name == 'Vé lượt'}">
                                <option value="" th:if="${ticket.stationStart == null}" selected>Chưa có</option>
                                <option th:each="s : ${stations}"
                                        th:value="${s.stationId}"
                                        th:text="${s.name}"
                                        th:selected="${ticket.stationStart != null and s.stationId == ticket.stationStart.stationId}">
                                </option>
                            </select>
                            <span th:if="${ticket.name != 'Vé lượt'}">-</span>
                        </td>

                        <!-- Ga đến -->
                        <td>
                            <select name="stationEndId"
                                    th:if="${ticket.name == 'Vé lượt'}">
                                <option value="" th:if="${ticket.stationEnd == null}" selected>Chưa có</option>
                                <option th:each="s : ${stations}"
                                        th:value="${s.stationId}"
                                        th:text="${s.name}"
                                        th:selected="${ticket.stationEnd != null and s.stationId == ticket.stationEnd.stationId}">
                                </option>
                            </select>
                            <span th:if="${ticket.name != 'Vé lượt'}">-</span>
                        </td>
                        <td class="action-buttons">
                            <button type="submit">Lưu</button>
                            </form>

                            <!-- ✅ Form xóa -->
                            <form th:action="@{/adminManage/manageTicketType/delete/{id}(id=${ticket.ticketTypeId})}" method="post">
                                <button type="submit" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
