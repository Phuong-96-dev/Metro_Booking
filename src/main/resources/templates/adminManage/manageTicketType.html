<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Danh sách loại vé</title>
    <link rel="stylesheet" th:href="@{/common/sidebar.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/admin/manageTicket.css}" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- Thông báo lỗi -->
<div class="alert-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show custom-alert" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show custom-alert" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>
<!-- Container chính sử dụng Bootstrap Grid -->
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 p-0">
            <div th:replace="~{common/sidebar :: sidebar}"></div>
        </div>

        <div class="col-md-10 p-4">
            <div class="content-container">
                <h2 class="mb-4">Quản lý loại vé</h2>

                <!-- Form: Thêm vé thời hạn -->
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">Thêm vé theo thời hạn</div>
                    <div class="card-body">
                        <form th:action="@{/adminManage/manageTicketType/create}" method="post" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Tên vé</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Giá</label>
                                <input type="number" name="price" class="form-control" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Thời hạn (ngày)</label>
                                <input type="number" name="durationDays" class="form-control" required min="1">
                            </div>
                            <div class="col-12 form-check ms-2">
                                <input class="form-check-input" type="checkbox" name="studentTicket" value="true" id="newStudentTicket">
                                <label class="form-check-label" for="newStudentTicket">Đây là loại vé sinh viên</label>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success">Thêm Vé</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Form: Thêm vé lượt -->
                <div class="card mb-4">
                    <div class="card-header bg-secondary text-white">Thêm vé lượt</div>
                    <div class="card-body">
                        <form th:action="@{/adminManage/manageTicketType/create}" method="post" class="row g-3">
                            <input type="hidden" name="name" value="Vé lượt">
                            <div class="col-md-4">
                                <label class="form-label">Giá</label>
                                <input type="number" name="price" class="form-control" required min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ga đi</label>
                                <select name="stationStartId" class="form-select" required>
                                    <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Ga đến</label>
                                <select name="stationEndId" class="form-select" required>
                                    <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success">Thêm Vé</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Danh sách vé -->
                <div class="card">
                    <div class="card-header bg-dark text-white">Danh sách loại vé</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên</th>
                                    <th>Giá</th>
                                    <th>Thời hạn</th>
                                    <th>Vé sinh viên</th>
                                    <th>Ga đi</th>
                                    <th>Ga đến</th>
                                    <th>Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="ticket : ${ticketTypes}">
                                        <td th:text="${ticket.ticketTypeId}"></td>
                                        <td><input type="text" name="name" th:value="${ticket.name}" class="form-control" required
                                                   th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|"></td>
                                        <td><input type="number" name="price" th:value="${ticket.price}" class="form-control" required
                                                   th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|"></td>

                                        <td th:if="${ticket.name != 'Vé lượt'}">
                                            <input type="number" name="durationDays" th:value="${ticket.durationDays}" class="form-control" required
                                                   th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|">
                                        </td>
                                        <td th:if="${ticket.name == 'Vé lượt'}">-</td>

                                        <td th:if="${ticket.name == 'Vé lượt'}">
                                            <select name="stationStartId" class="form-select"
                                                    th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|">
                                                <option value="" th:if="${ticket.stationStart == null}" selected>Chưa có</option>
                                                <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"
                                                        th:selected="${ticket.stationStart != null and s.stationId == ticket.stationStart.stationId}">
                                                </option>
                                            </select>
                                        </td>
                                        <td th:if="${ticket.name != 'Vé lượt'}">-</td>

                                        <td th:if="${ticket.name == 'Vé lượt'}">
                                            <select name="stationEndId" class="form-select"
                                                    th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|">
                                                <option value="" th:if="${ticket.stationEnd == null}" selected>Chưa có</option>
                                                <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"
                                                        th:selected="${ticket.stationEnd != null and s.stationId == ticket.stationEnd.stationId}">
                                                </option>
                                            </select>
                                        </td>
                                        <td th:if="${ticket.name != 'Vé lượt'}">-</td>

                                        <td>
                                            <input type="checkbox" name="studentTicket" value="true"
                                                   th:checked="${ticket.studentTicket}"
                                                   th:attr="form=|ticketTypeForm-${ticket.ticketTypeId}|">
                                        </td>

                                        <!-- Nút hành động -->
                                        <td class="d-flex justify-content-center gap-2">
                                            <form th:action="@{/adminManage/manageTicketType/update/{id}(id=${ticket.ticketTypeId})}"
                                                  th:id="|ticketTypeForm-${ticket.ticketTypeId}|" method="post" class="d-inline">
                                                <button type="submit" class="btn-save">
                                                    <i class="fas fa-save"></i>
                                                </button>
                                            </form>
                                            <form th:action="@{/adminManage/manageTicketType/delete/{id}(id=${ticket.ticketTypeId})}" method="post">
                                        <button type="submit" class="btn-delete" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <!-- Thanh phân trang -->
                            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-3">
                                <ul class="pagination justify-content-center">

                                    <!-- Nút Prev -->
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/adminManage/manageTicketType(page=${currentPage - 1})}" aria-label="Previous">
                                            <span aria-hidden="true">&laquo;</span>
                                        </a>
                                    </li>

                                    <!-- Danh sách các trang -->
                                    <li class="page-item"
                                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{/adminManage/manageTicketType(page=${i})}"
                                           th:text="${i + 1}">1</a>
                                    </li>

                                    <!-- Nút Next -->
                                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/adminManage/manageTicketType(page=${currentPage + 1})}" aria-label="Next">
                                            <span aria-hidden="true">&raquo;</span>
                                        </a>
                                    </li>

                                </ul>
                            </nav>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{common/chatbox :: chatbox}"></div>
</body>
</html>
