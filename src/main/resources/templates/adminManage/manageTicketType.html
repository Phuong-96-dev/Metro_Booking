<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách loại vé</title>

    <!-- Nhúng css sidebar -->
    <link rel="stylesheet" th:href="@{/common/sidebar.css}" type="text/css">

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 220px;
            background: #003366;
            color: white;
            padding-top: 1rem;
            overflow-y: auto;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 0.75rem 1rem;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover {
            background: #002244;
            border-left: 3px solid #ffc107;
        }

        .content {
            margin-left: 220px; /* chừa chỗ sidebar */
            padding: 2rem;
        }

        form {
            margin-bottom: 20px;
            background: #f8f8f8;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        label {
            display: inline-block;
            margin: 5px 10px;
        }
        input[type="text"],
        input[type="number"],
        select {
            padding: 6px;
            margin-left: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 6px 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            text-align: left;
        }
        th, td {
            padding: 10px;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .edit-form {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<!-- Sidebar cố định -->
<div th:replace="common/sidebar :: sidebar"></div>

<!-- Nội dung chính -->
<div class="content">
    <h1>Danh sách các loại vé</h1>

    <!-- Form thêm vé -->
    <h3>Thêm loại vé mới</h3>
    <form th:action="@{/adminManage/manageTicketType/create}" method="post">
        <p>Loại vé: <strong>Vé 1 lần</strong></p>
        <input type="hidden" name="name" value="Vé 1 lần" />

        <label>Giá:
            <input type="number" name="price" required min="0" />
        </label>

        <label>Ga đi:
            <select name="stationStartId" required>
                <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
            </select>
        </label>

        <label>Ga đến:
            <select name="stationEndId" required>
                <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
            </select>
        </label>

        <button type="submit">Thêm Vé</button>
    </form>

    <!-- Bảng danh sách vé -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên vé</th>
            <th>Giá</th>
            <th>Thời hạn</th>
            <th>Ga đi</th>
            <th>Ga đến</th>
            <th>Chức năng</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${ticketTypes}">
            <td th:text="${ticket.ticketTypeId}"></td>
            <td>
                <form th:action="@{/adminManage/manageTicketType/update/{id}(id=${ticket.ticketTypeId})}" method="post" class="edit-form">
                    <input type="text" name="name" th:value="${ticket.name}" required />
            </td>
            <td>
                <input type="number" name="price" th:value="${ticket.price}" required />
            </td>
            <td th:if="${ticket.name != 'Vé 1 lần'}">
                <input type="number" name="durationDays" th:value="${ticket.durationDays}" required />
            </td>
            <td th:if="${ticket.name == 'Vé 1 lần'}">-</td>

            <td>
                <select name="stationStartId" th:if="${ticket.name == 'Vé 1 lần'}">
                    <option value="" th:if="${ticket.stationStart == null}" selected>Chưa có</option>
                    <option th:each="s : ${stations}"
                            th:value="${s.stationId}"
                            th:text="${s.name}"
                            th:selected="${ticket.stationStart != null and s.stationId == ticket.stationStart.stationId}">
                    </option>
                </select>
                <span th:if="${ticket.name != 'Vé 1 lần'}">-</span>
            </td>

            <td>
                <select name="stationEndId" th:if="${ticket.name == 'Vé 1 lần'}">
                    <option value="" th:if="${ticket.stationEnd == null}" selected>Chưa có</option>
                    <option th:each="s : ${stations}"
                            th:value="${s.stationId}"
                            th:text="${s.name}"
                            th:selected="${ticket.stationEnd != null and s.stationId == ticket.stationEnd.stationId}">
                    </option>
                </select>
                <span th:if="${ticket.name != 'Vé 1 lần'}">-</span>
            </td>
            <td class="action-buttons">
                <button type="submit">Lưu</button>
                </form>

                <form th:action="@{/adminManage/manageTicketType/delete/{id}(id=${ticket.ticketTypeId})}" method="post">
                    <button type="submit" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
