<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách loại vé</title>

    <!-- Nhúng css sidebar -->
    <link rel="stylesheet" th:href="@{/common/sidebar.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/admin/manageTicket.css}" type="text/css">

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


</head>
<body>

<!-- Container chính sử dụng Bootstrap Grid -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar cố định -->
        <div class="col-md-2 p-0">
            <div th:replace="common/sidebar :: sidebar"></div>
        </div>

        <!-- Nội dung chính -->
        <div class="col-md-10">
            <div class="content">
                <h1>Danh sách các loại vé</h1>

                <h3>Thêm loại vé có thời hạn</h3>
                <form th:action="@{/adminManage/manageTicketType/create}" method="post">
                    <!-- Tên vé nhập tự do -->
                    <label>Tên vé:
                        <input type="text" name="name" required />
                    </label>

                    <!-- Giá vé -->
                    <label>Giá:
                        <input type="number" name="price" required min="0" />
                    </label>

                    <!-- Thời hạn sử dụng (số ngày) -->
                    <label>Thời hạn (ngày):
                        <input type="number" name="durationDays" required min="1" />
                    </label>

                    <button type="submit">Thêm Vé</button>
                </form>

                <!-- ✅ Form thêm mới -->
                <h3>Thêm loại vé mới</h3>
                <form th:action="@{/adminManage/manageTicketType/create}" method="post">
                    <!-- Tên vé cố định -->
                    <p>Loại vé: <strong>Vé lượt</strong></p>
                    <input type="hidden" name="name" value="Vé lượt" />

                    <!-- Giá có thể điều chỉnh -->
                    <label>Giá:
                        <input type="number" name="price" required min="0" />
                    </label>

                    <!-- Ga đi -->
                    <label>Ga đi:
                        <select name="stationStartId" required>
                            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                        </select>
                    </label>

                    <!-- Ga đến -->
                    <label>Ga đến:
                        <select name="stationEndId" required>
                            <option th:each="s : ${stations}" th:value="${s.stationId}" th:text="${s.name}"></option>
                        </select>
                    </label>

                    <button type="submit">Thêm Vé</button>
                </form>

                <!-- ✅ Danh sách và chỉnh sửa -->
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên vé</th>
                        <th>Giá</th>
                        <th>Thời hạn</th>
                        <th>Ga đi</th>
                        <th>Ga đến</th>
                        <th>Chức năng</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket : ${ticketTypes}">
                        <td th:text="${ticket.ticketTypeId}"></td>
                        <td>
                            <form th:action="@{/adminManage/manageTicketType/update/{id}(id=${ticket.ticketTypeId})}" method="post" class="edit-form">
                                <input type="text" name="name" th:value="${ticket.name}" required />
                        </td>
                        <td>
                            <input type="number" name="price" th:value="${ticket.price}" required />
                        </td>
                        <td th:if="${ticket.name != 'Vé lượt'}">
                            <input type="number" name="durationDays" th:value="${ticket.durationDays}" required />
                        </td>

                        <td th:if="${ticket.name == 'Vé lượt'}">-</td>

                        <td>
                            <select name="stationStartId"
                                    th:if="${ticket.name == 'Vé lượt'}">
                                <option value="" th:if="${ticket.stationStart == null}" selected>Chưa có</option>
                                <option th:each="s : ${stations}"
                                        th:value="${s.stationId}"
                                        th:text="${s.name}"
                                        th:selected="${ticket.stationStart != null and s.stationId == ticket.stationStart.stationId}">
                                </option>
                            </select>
                            <span th:if="${ticket.name != 'Vé lượt'}">-</span>
                        </td>

                        <!-- Ga đến -->
                        <td>
                            <select name="stationEndId"
                                    th:if="${ticket.name == 'Vé lượt'}">
                                <option value="" th:if="${ticket.stationEnd == null}" selected>Chưa có</option>
                                <option th:each="s : ${stations}"
                                        th:value="${s.stationId}"
                                        th:text="${s.name}"
                                        th:selected="${ticket.stationEnd != null and s.stationId == ticket.stationEnd.stationId}">
                                </option>
                            </select>
                            <span th:if="${ticket.name != 'Vé lượt'}">-</span>
                        </td>
                        <td class="action-buttons">
                            <button type="submit" class="custom-button save-button">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="svgIcon save-top">
                                    <path fill="white" d="M17 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10zm-5 14a1 1 0 1 0 0 2h-2a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2a1 1 0 1 0 0-2h2zm4-6a1 1 0 0 0-1-1H8a1 1 0 1 0 0 2h7a1 1 0 0 0 1-1zm0-4a1 1 0 0 0-1-1H8a1 1 0 0 0 0 2h7a1 1 0 0 0 1-1z"/>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="svgIcon save-bottom">
                                    <path fill="white" d="M17 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10zm-5 14a1 1 0 1 0 0 2h-2a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2a1 1 0 1 0 0-2h2zm4-6a1 1 0 0 0-1-1H8a1 1 0 1 0 0 2h7a1 1 0 0 0 1-1zm0-4a1 1 0 0 0-1-1H8a1 1 0 0 0 0 2h7a1 1 0 0 0 1-1z"/>
                                </svg>
                            </button>
                            </form>

                            <!-- ✅ Form xóa -->
                            <form th:action="@{/adminManage/manageTicketType/delete/{id}(id=${ticket.ticketTypeId})}" method="post">
                                <button type="submit" class="custom-button delete-button" onclick="return confirm('Bạn có chắc muốn xóa?')">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 69 14" class="svgIcon bin-top">
                                        <g clip-path="url(#clip0_35_24)">
                                            <path fill="white" d="M20.8232 2.62734L19.9948 4.21304C19.8224 4.54309 19.4808 4.75 19.1085 4.75H4.92857C2.20246 4.75 0 6.87266 0 9.5C0 12.1273 2.20246 14.25 4.92857 14.25H64.0714C66.7975 14.25 69 12.1273 69 9.5C69 6.87266 66.7975 4.75 64.0714 4.75H49.8915C49.5192 4.75 49.1776 4.54309 49.0052 4.21305L48.1768 2.62734C47.3451 1.00938 45.6355 0 43.7719 0H25.2281C23.3645 0 21.6549 1.00938 20.8232 2.62734ZM64.0023 20.0648C64.0397 19.4882 63.5822 19 63.0044 19H5.99556C5.4178 19 4.96025 19.4882 4.99766 20.0648L8.19375 69.3203C8.44018 73.0758 11.6746 76 15.5712 76H53.4288C57.3254 76 60.5598 73.0758 60.8062 69.3203L64.0023 20.0648Z"/>
                                        </g>
                                        <defs>
                                            <clipPath id="clip0_35_24">
                                                <rect fill="white" height="14" width="69"></rect>
                                            </clipPath>
                                        </defs>
                                    </svg>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 69 57" class="svgIcon bin-bottom">
                                        <g clip-path="url(#clip0_35_22)">
                                            <path fill="white" d="M20.8232 -16.3727L19.9948 -14.787C19.8224 -14.4569 19.4808 -14.25 19.1085 -14.25H4.92857C2.20246 -14.25 0 -12.1273 0 -9.5C0 -6.8727 2.20246 -4.75 4.92857 -4.75H64.0714C66.7975 -4.75 69 -6.8727 69 -9.5C69 -12.1273 66.7975 -14.25 64.0714 -14.25H49.8915C49.5192 -14.25 49.1776 -14.4569 49.0052 -14.787L48.1768 -16.3727C47.3451 -17.9906 45.6355 -19 43.7719 -19H25.2281C23.3645 -19 21.6549 -17.9906 20.8232 -16.3727ZM64.0023 1.0648C64.0397 0.4882 63.5822 0 63.0044 0H5.99556C5.4178 0 4.96025 0.4882 4.99766 1.0648L8.19375 50.3203C8.44018 54.0758 11.6746 57 15.5712 57H53.4288C57.3254 57 60.5598 54.0758 60.8062 50.3203L64.0023 1.0648Z"/>
                                        </g>
                                        <defs>
                                            <clipPath id="clip0_35_22">
                                                <rect fill="white" height="57" width="69"></rect>
                                            </clipPath>
                                        </defs>
                                    </svg>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
