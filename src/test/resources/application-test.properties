spring.datasource.url=jdbc:h2:mem:metro-auth;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
app.google.client-id=
app.google.client-secret=
app.auth.allow-legacy-passwords=false
app.sepay.enabled=true
app.sepay.bank=Vietcombank
app.sepay.account-number=0123456789
app.sepay.account-holder=METRO TEST
app.sepay.payment-prefix=METRO
app.sepay.webhook-auth-mode=HMAC
app.sepay.webhook-secret=test-sepay-secret
app.sepay.webhook-max-age-seconds=300
